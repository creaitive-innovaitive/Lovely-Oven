/* ---------- tax ---------- */
function taxView() {
  var s = DB.settings, y = new Date().getFullYear(), yr = +($('taxyear') ? $('taxyear').value : y), box = h('div', { style: 'display:grid;gap:14px' });
  function setting(label, key, suffix) {

    inp.onchange = function () {
      var v = parseFloat(inp.value.replace(/,/g, ''));
      if (!isFinite(v) || v < 0) { toast('Enter a number.', true); inp.value = String(s[key]); return; }
      SB.from('settings').upsert({ key: key, value: String(v) }).then(ok).then(function () { s[key] = v; toast('Saved'); render(); }).catch(function (e) { toast(e.message, true); });
    };

  }
  box.appendChild(h('div', { class: 'panel' }, h('h2', { text: 'Rates' }),

    h('p', { class: 'note', text: 'Estimate only: a flat percentage of revenue received, and nothing due while the year stays under the threshold. The defaults are placeholders. Set the rates your accountant gives you.' })));
  var years = {}; years[y] = 1; DB.orders.forEach(function (o) { years[+o.order_date.slice(0, 4)] = 1; });
  var sel = h('select', { id: 'taxyear' }, Object.keys(years).sort().reverse().map(function (k) { return h('option', { value: k, text: k }); })); sel.value = String(yr); sel.onchange = render;
  var rows = [], tot = { rev: 0, vat: 0, pit: 0 }, q;
  for (q = 0; q < 4; q++) {
    var r = [yr + '-' + p2(q * 3 + 1) + '-01', iso(new Date(yr, q * 3 + 3, 0))], t = totals(r), tx = taxFor(t.revenue, yr);
    rows.push(['Q' + (q + 1), t.revenue, tx.vat, tx.pit, t.costs]); tot.rev += t.revenue; tot.vat += tx.vat; tot.pit += tx.pit;
  }
  var th = function (x) { return h('th', { text: x }); }, td = function (x, c) { return h('td', { class: c || 'mono', style: c ? null : 'text-align:right', text: typeof x === 'number' ? fmt(x) : x }); };
  box.appendChild(h('div', { class: 'panel' }, h('div', { class: 'row' }, h('h2', { text: 'Estimated tax' }), sel),
    yearRevenue(yr) <= s.exempt_threshold ? h('p', { class: 'note', text: 'Revenue for ' + yr + ' is ' + fmt(yearRevenue(yr)) + ', under the ' + fmt(s.exempt_threshold) + ' threshold, so the estimate is nil.' }) : null,
    h('div', { class: 'scroll' }, h('table', null, h('tr', null, ['Quarter', 'Revenue', 'VAT', 'Income tax', 'Total tax', 'Costs'].map(th)),
      rows.map(function (x) { return h('tr', null, td(x[0], ''), td(x[1]), td(x[2]), td(x[3]), td(x[2] + x[3]), td(x[4])); }),
      h('tr', null, td('Year', ''), td(tot.rev), td(tot.vat), td(tot.pit), td(tot.vat + tot.pit), td(rows.reduce(function (a, x) { return a + x[4]; }, 0)))))));
  return box;
}

/* ---------- edit database ---------- */
var TABLES = {
  orders: { pk: 'id', sort: 'order_date', cols: [['order_date', 'Date', 'date'], ['customer', 'Customer'], ['qty', 'Meals', 'int'], ['food', 'Food'], ['pfood', 'Food price', 'int'], ['extra', 'Extras'], ['pextra', 'Extras price', 'int'], ['disc', 'Discount', 'int'], ['paid', 'Paid', 'int'], ['method', 'Method', ['', 'Cash', 'Transfer']], ['notes', 'Notes'], ['oid', 'Order id', 'ro']],
    warn: 'Changing meals here does not add or remove booked meals. Use Edit in the orders page for that.' },
  meals: { pk: 'seq', sort: 'meal_date', cols: [['meal_date', 'Date', 'date'], ['customer', 'Customer'], ['status', 'Status', ['Scheduled', 'Served', 'Cancelled']], ['note', 'Note'], ['oid', 'Order id', 'ro'], ['id', 'Meal id', 'ro']] },
  expenses: { pk: 'id', sort: 'expense_date', cols: [['expense_date', 'Date', 'date'], ['vendor', 'Vendor'], ['category', 'Category', CATS], ['amount', 'Amount', 'int'], ['vat', 'VAT', 'int'], ['notes', 'Notes']] }
};
function dataView() {
  var T = TABLES[dataTable], rows = DB[dataTable].slice().sort(function (a, b) { return a[T.sort] < b[T.sort] ? 1 : a[T.sort] > b[T.sort] ? -1 : b[T.pk] - a[T.pk]; });
  var q = dataQ.trim().toLowerCase();
  if (q) rows = rows.filter(function (r) { return JSON.stringify(r).toLowerCase().indexOf(q) >= 0; });
  var shown = rows.slice(0, 300);
  var sel = h('select', null, Object.keys(TABLES).map(function (k) { return h('option', { value: k, text: k }); })); sel.value = dataTable; sel.onchange = function () { dataTable = sel.value; render(); };
  var search = h('input', { type: 'search', placeholder: 'Search', value: dataQ, 'aria-label': 'Search' });
  search.oninput = function () { dataQ = search.value; clearTimeout(pending); pending = setTimeout(function () { render(); var s = document.querySelector('#view input[type=search]'); if (s) { s.focus(); s.setSelectionRange(99, 99); } }, 300); };
  function cell(r, c) {
    var key = c[0], type = c[2], td = h('td'), el;
    if (type === 'ro') { td.className = 'ro'; td.textContent = r[key]; return td; }
    if (Array.isArray(type)) { el = h('select', null, type.map(function (o) { return h('option', { value: o, text: o || '—' }); })); el.value = r[key]; }
    else { el = h('input', { type: type === 'date' ? 'date' : 'text', class: type === 'int' ? 'num' : '', inputmode: type === 'int' ? 'numeric' : null }); el.value = r[key] == null ? '' : r[key]; }
    el.onchange = function () {
      var v = el.value;
      if (type === 'int') { v = parseInt(String(v).replace(/\D/g, ''), 10) || 0; el.value = v; }
      if (type === 'date' && !v) { el.value = r[key]; return; }
      var patch = {}; patch[key] = v;
      SB.from(dataTable).update(patch).eq(T.pk, r[T.pk]).then(ok).then(function () { r[key] = v; td.classList.add('flash'); setTimeout(function () { td.classList.remove('flash'); }, 700); })
        .catch(function (e) { toast(e.message, true); el.value = r[key]; });

  return h('div', { class: 'panel' }, h('div', { class: 'row' }, h('h2', { text: 'Edit data' }), sel, search, h('span', { class: 'sub', text: shown.length + ' of ' + rows.length + ' rows' })),
    T.warn ? h('p', { class: 'note', text: T.warn }) : null,
    h('p', { class: 'sub', text: 'Changes save as soon as you leave a cell.' }),
    h('div', { class: 'scroll' }, h('table', null, h('tr', null, T.cols.map(function (c) { return h('th', { text: c[1] }); }), h('th', { text: '' })),
      shown.map(function (r) {

        } })));
      }))));
}

/* ---------- csv ---------- */
function csv() {
  var r = range(), t = totals(r), lines = [['type', 'date', 'name', 'category', 'amount', 'received']];
  t.os.forEach(function (o) { lines.push(['sale', o.order_date, o.customer, o.food, sales(o), o.paid]); });
  t.es.forEach(function (e) { lines.push(['expense', e.expense_date, e.vendor, e.category, e.amount, '']); });
  var text = lines.map(function (l) { return l.map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = h('a', { href: URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv' })), download: 'lovely-oven-' + r[0] + '-' + r[1] + '.csv' }); document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- keep the numbers current ---------- */
var liveOn = false, dirty = false, liveT;
function editing() { var a = document.activeElement; return !!(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && $('view').contains(a)); }
function refreshSoon() {
  clearTimeout(liveT);
  liveT = setTimeout(function () { if (editing()) { dirty = true; return; } dirty = false; load(); }, 600);
}
function watchLive() {
  if (liveOn) return; liveOn = true;
  ['orders', 'meals', 'expenses'].forEach(function (t) {
    SB.channel('live-' + t).on('postgres_changes', { event: '*', schema: 'public', table: t }, refreshSoon).subscribe();
  });
  document.addEventListener('focusout', function () { if (dirty) setTimeout(refreshSoon, 300); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refreshSoon(); });
  setInterval(function () { if (document.visibilityState === 'visible') refreshSoon(); }, 30000);
}

/* ---------- login ---------- */
function showLogin(msg) { $('app').hidden = true; $('login').hidden = false; $('loginmsg').textContent = msg || 'Sign in with your admin account.'; }
function enter(session) {
  SB.from('admins').select('email').then(function (r) {
    if (r.error || !r.data || !r.data.length) { SB.auth.signOut(); showLogin('That account is not an admin.'); return; }
    $('login').hidden = true; $('app').hidden = false; $('who').textContent = session.user.email;
    try { localStorage.setItem('lo-admin', '1'); } catch (e) { /* ignore */ }
    load(); watchLive();
  });
}
function init() {
  $('period').appendChild(document.createDocumentFragment());
  PERIODS.forEach(function (p) { $('period').appendChild(h('option', { value: p[0], text: p[1] })); });
  $('period').value = 'month';
  ['period', 'from', 'to'].forEach(function (id) { $(id).onchange = render; });
  $('refresh').onclick = function () { $('menu').classList.remove('open'); load(); }; $('csv').onclick = csv;
  $('burger').onclick = function (ev) { ev.stopPropagation(); var o = $('menu').classList.toggle('open'); $('burger').setAttribute('aria-expanded', o ? 'true' : 'false'); };
  document.addEventListener('click', function (ev) { if (!$('menu').contains(ev.target)) $('menu').classList.remove('open'); });
  $('out').onclick = function () { SB.auth.signOut().then(function () { location.replace('/'); }); };
  $('loginform').onsubmit = function (ev) {
    ev.preventDefault(); $('loginmsg').textContent = 'Signing in…';
    SB.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value }).then(function (r) {
      if (r.error) showLogin('Wrong email or password.'); else enter(r.data.session);
    });
  };
  SB.auth.getSession().then(function (r) { if (r.data.session) enter(r.data.session); else showLogin(); });
}
init();
})();
