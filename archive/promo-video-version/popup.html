<div class="promo" id="promo" role="dialog" aria-modal="true" aria-labelledby="promo-title">
  <div class="promo-card">
    <button class="promo-close" type="button" aria-label="Close" data-promo-close>&times;</button>
    <span class="promo-tag">New on the menu</span>
    <h2 id="promo-title">Build Your Own <em>Chicken Burger</em></h2>
    <video class="promo-media" id="promo-video" muted loop playsinline preload="none" poster="img/promo/burger-poster.jpg" aria-label="The chicken burger lifting apart into its ingredients"></video>
    <div class="promo-toggle" role="group" aria-label="Choose your burger">
      <button class="promo-opt" type="button" data-size="normal" aria-pressed="false">Normal <b>₫100,000</b></button>
      <button class="promo-opt" type="button" data-size="full" aria-pressed="true">Full burger <b>₫150,000</b></button>
    </div>
    <div class="promo-price" id="promo-price">₫150,000</div>
    <p class="promo-ing" id="promo-ing"></p>
    <p class="promo-note"><strong>Special price until 30 November.</strong><br>Available until 31 December.</p>
    <a class="promo-cta" href="/order#o-burger">Order now</a>
    <button class="promo-later" type="button" data-promo-close>Maybe later</button>
  </div>
</div>
