<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Lovely Oven Orders</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a narrow rail on the left, one working screen on the right. The order screen is two panels (who and how many, then which days) over a checkout bar, so everything fits an iPad held sideways. */
:root {
  --bg: #eef1f6; --surface: #ffffff; --surface2: #f4f6fb; --ink: #121a2b; --muted: #566077;
  --line: #d8deea; --line2: #bcc5da;
  --accent: #2c44c9; --accent-ink: #ffffff; --accent-soft: #e2e7fb;
  --ok: #17703f; --ok-soft: #dcf2e5; --warn: #8f4f00; --warn-soft: #fbe8c8; --bad: #b0221a; --bad-soft: #fce3e0;
  --rail: #121a2b; --rail-ink: #c3cde6;
  --shadow: 0 1px 2px rgba(18,26,43,.06), 0 8px 24px rgba(18,26,43,.07);
  --display: 'Bricolage Grotesque', ui-rounded, system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b101c; --surface: #151c2d; --surface2: #1b2438; --ink: #e8ecf7; --muted: #9ba6bf;
    --line: #2a3552; --line2: #3b496b;
    --accent: #93a5ff; --accent-ink: #0b101c; --accent-soft: #232e63;
    --ok: #62d596; --ok-soft: #143a2a; --warn: #f2b45c; --warn-soft: #3d2c10; --bad: #ff8c80; --bad-soft: #42191b;
    --rail: #080c15; --rail-ink: #a9b5d2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b101c; --surface: #151c2d; --surface2: #1b2438; --ink: #e8ecf7; --muted: #9ba6bf;
  --line: #2a3552; --line2: #3b496b;
  --accent: #93a5ff; --accent-ink: #0b101c; --accent-soft: #232e63;
  --ok: #62d596; --ok-soft: #143a2a; --warn: #f2b45c; --warn-soft: #3d2c10; --bad: #ff8c80; --bad-soft: #42191b;
  --rail: #080c15; --rail-ink: #a9b5d2;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 17px/1.35 var(--body); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2 { margin: 0; font-family: var(--display); letter-spacing: -.01em; }
h1 { font-size: 30px; line-height: 1; font-weight: 700; }
h2 { font-size: 21px; line-height: 1.1; font-weight: 700; }
p { margin: 0; }

.app { height: 100%; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 10px; }

/* rail */
.rail { background: var(--rail); border-radius: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 8px; }
.brand { font: 700 14px/1 var(--display); color: #fff; text-align: center; letter-spacing: .01em; margin: 4px 0 12px; }
.brand b { display: block; color: var(--accent); filter: brightness(1.5); font-size: 12px; font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: .12em; }
.rail button { position: relative; width: 76px; min-height: 76px; border: 0; border-radius: 20px; background: transparent; color: var(--rail-ink); display: grid; place-items: center; align-content: center; gap: 4px; font: 600 12px var(--body); }
.rail button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.rail .spacer { flex: 1; }
.rail button[hidden] { display: none; }
.badge { position: absolute; top: 5px; right: 7px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font: 600 13px var(--mono); display: grid; place-items: center; }
.badge[hidden] { display: none; }

/* shared pieces */
.view { display: flex; flex-direction: column; gap: 12px; min-height: 0; flex: 1; }
.vhead { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; min-height: 56px; }
.vhead .grow { flex: 1; }
.panel { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 20px; min-height: 0; min-width: 0; overflow: auto; }
.lbl, .field > label { display: block; font: 700 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 7px; }
.sub { color: var(--muted); font-size: 15px; font-weight: 500; }
.field { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }

input[type="text"], input[type="email"], input[type="password"], .money input { width: 100%; height: 60px; border: 2px solid var(--line2); border-radius: 15px; background: var(--surface); color: var(--ink); font: 600 22px var(--body); padding: 0 16px; }
input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, .money input:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); outline-offset: 0; }
input::placeholder { color: var(--muted); font-weight: 500; opacity: .8; }
.money { position: relative; }
.money input { font-family: var(--mono); font-weight: 600; text-align: right; padding-right: 62px; font-size: 21px; }
.money span { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font: 600 12px var(--mono); color: var(--muted); pointer-events: none; }

.btn { min-height: 56px; padding: 0 22px; border-radius: 15px; border: 2px solid var(--line2); background: var(--surface); color: var(--ink); font: 700 17px var(--body); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 48px; padding: 0 16px; font-size: 16px; }
.btn:disabled { opacity: .45; }
body.busy .btn, body.busy .chip, body.busy .seg button { pointer-events: none; opacity: .6; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { min-height: 48px; padding: 0 16px; border-radius: 26px; border: 2px solid var(--line); background: var(--surface2); font: 600 17px var(--body); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips.small .chip { min-height: 44px; font: 600 15px var(--mono); padding: 0 14px; }
.chips:empty { display: none; }

.seg { display: flex; border: 2px solid var(--line2); border-radius: 15px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 52px; padding: 0 14px; border: 0; background: transparent; font: 700 16px var(--body); white-space: nowrap; }
.seg button + button { border-left: 2px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.pill { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 16px; font: 600 14px var(--mono); background: var(--surface2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

.datepick { display: flex; align-items: center; border: 2px solid var(--line2); border-radius: 15px; background: var(--surface); overflow: hidden; }
.datepick button { min-height: 52px; border: 0; background: transparent; font: 700 17px var(--body); }
.whenwrap { position: relative; display: flex; flex: 1; }
.whenwrap .when { flex: 1; }
.whenwrap input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.datepick .step { width: 56px; font-size: 26px; }
.datepick .when { padding: 0 14px; min-width: 190px; border-left: 2px solid var(--line); border-right: 2px solid var(--line); }

/* new order */
.order-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 14px; flex: 1; min-height: 0; }
.combo { position: relative; }
.suggest { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 2px solid var(--line2); border-radius: 15px; box-shadow: var(--shadow); overflow: hidden; }
.suggest button { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; border: 0; background: transparent; text-align: left; font: 700 19px var(--body); }
.suggest button + button { border-top: 1px solid var(--line); }
.suggest button small { font: 500 14px var(--mono); color: var(--muted); }
.suggest button.on { background: var(--accent-soft); }
.hint { min-height: 32px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; color: var(--muted); font-size: 15px; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; height: 64px; border: 2px solid var(--line2); border-radius: 16px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: var(--surface2); font: 600 34px var(--body); }
.stepper button:active { background: var(--accent-soft); }
.stepper output { display: grid; place-items: center; font: 600 34px var(--mono); }
.inline { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.inline .stepper { width: 200px; flex: none; }
.inline .money { width: 230px; flex: none; }
.inline .chips { margin: 0; }
.more { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; border: 2px dashed var(--line2); border-radius: 15px; background: transparent; font: 700 17px var(--body); text-align: left; }
.more span:first-child { flex: 1; }
.extras { padding-top: 14px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px 16px; }
.extras input[type="text"] { height: 54px; font-size: 19px; }
.extras .money input { height: 54px; }

/* the day tickets */
.planhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.planhead h2 { flex: 1; }
.plan-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 4px; }
.plan-actions .grow { flex: 1; }
.week { margin-top: 10px; }
.week .cap { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.days { display: grid; gap: 8px; }
.day { border: 2px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; min-width: 0; }
.day .top { display: grid; justify-items: center; align-content: center; gap: 0; padding: 6px 4px 5px; border-bottom: 2px dashed var(--line2); }
.day .dow { font: 700 12px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.day .num { font: 700 28px/1 var(--display); }
.day .mon { font: 600 12px var(--body); color: var(--muted); }
.day .ctl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.day .ctl button { min-height: 52px; border: 0; background: transparent; font: 600 28px var(--body); }
.day .ctl button:active:not(:disabled) { background: var(--accent-soft); }
.day .ctl button:disabled { opacity: .25; }
.day .count { font: 600 28px var(--mono); min-width: 28px; text-align: center; }
.day.on { border-color: var(--accent); background: var(--accent-soft); }
.day.on .top { border-bottom-color: var(--accent); }
.day.on .count { color: var(--accent); }
.day.today .mon { color: var(--accent); font-weight: 700; }
.day.off { opacity: .4; }

/* checkout bar */
.checkout { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 14px 20px; }
.tot { min-width: 190px; }
.tot strong { display: block; font: 600 36px/1.05 var(--mono); letter-spacing: -.02em; }
.tot small { display: block; font: 500 14px var(--mono); color: var(--muted); margin-top: 3px; }
.tot small.owes { color: var(--warn); font-weight: 600; }
.checkout .part { width: 200px; }
.savebox { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.save { min-width: 200px; min-height: 64px; font-size: 20px; }
.why { font-size: 14px; color: var(--muted); min-height: 18px; }

/* meals today */
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.sect { display: flex; flex-direction: column; gap: 10px; }
.sect > h2 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 12px; }
.meal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px 14px 20px; border: 2px solid transparent; }
.meal.served { background: var(--ok-soft); box-shadow: none; }
.meal .who { min-width: 0; }
.meal .who strong { display: block; font: 700 24px/1.15 var(--display); overflow-wrap: anywhere; }
.meal .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.meal .ask { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.meal .ask span { flex: 1; min-width: 180px; font-weight: 600; }
.tick { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 700; }
.empty { display: grid; justify-items: start; gap: 12px; padding: 28px 8px; color: var(--muted); max-width: 520px; }
.empty strong { font: 700 22px var(--display); color: var(--ink); }
.scroll { overflow: auto; min-height: 0; flex: 1; padding-bottom: 8px; display: flex; flex-direction: column; gap: 18px; }

/* customers */
.cust-grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 14px; flex: 1; min-height: 0; }
.cust-grid .list { display: flex; flex-direction: column; gap: 12px; padding: 14px; }
.cust-grid .list .rows { overflow: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.crow { display: grid; gap: 6px; text-align: left; border: 2px solid transparent; background: var(--surface2); border-radius: 16px; padding: 12px 14px; min-height: 64px; width: 100%; }
.crow strong { font: 700 20px var(--display); }
.crow .chips { margin: 0; gap: 6px; }
.crow[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { background: var(--surface2); border-radius: 16px; padding: 12px 14px; }
.tile b { display: block; font: 600 28px/1.1 var(--mono); }
.tile.warn b { color: var(--warn); }
.tile.bad b { color: var(--bad); }
.tile span { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.box { border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row .grow { flex: 1; min-width: 160px; }
.row .money { width: 190px; }
.row .money input { height: 52px; font-size: 19px; }
.rl { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 16px; font-size: 16px; }
.rl span:nth-child(4n+1) { color: var(--muted); font-family: var(--mono); font-size: 14px; }
.rl .r { text-align: right; font-family: var(--mono); }

/* overlays */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(8,12,22,.55); }
.sheet { width: min(680px, 100%); max-height: 92%; overflow: auto; background: var(--surface); border-radius: 26px; padding: 22px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.toast { position: fixed; z-index: 40; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(720px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 14px 20px; border-radius: 16px; font-weight: 600; box-shadow: var(--shadow); }
.toast.bad { background: var(--bad); color: #fff; }
.boot { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; gap: 14px; justify-items: center; background: var(--bg); color: var(--muted); font-weight: 600; text-align: center; padding: 24px; }
.previewbar { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 8px 16px; font-weight: 600; font-size: 15px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .rail { order: 2; flex-direction: row; justify-content: center; padding: 6px; border-radius: 22px; }
  .rail .brand, .rail .spacer { display: none; }
  .rail button { width: 72px; min-height: 60px; }
  .view { overflow: auto; }
  .order-grid, .cust-grid, .split, .extras { grid-template-columns: minmax(0, 1fr); }
  .panel { overflow: visible; }
  .savebox { margin-left: 0; align-items: stretch; width: 100%; }
  .checkout .part { width: 100%; }
}

.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 360px); gap: 16px; align-items: start; }
.dishes { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px 20px; display: grid; gap: 14px; position: sticky; top: 0; }
.dishes h2 { font-size: 20px; }
.dishes h3 { font: 700 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 6px; }
.dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 17px; }
.dl b { font-family: var(--mono); text-align: right; }
.dl .sub { grid-column: 1 / -1; font-size: 14px; }
.modebar { display: flex; gap: 8px; }
.picker { display: grid; gap: 14px; }
select.pick { width: 100%; height: 56px; border: 2px solid var(--line2); border-radius: 15px; background: var(--surface); color: var(--ink); font: 600 19px var(--body); padding: 0 14px; }
select.pick:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); outline-offset: 0; }
.drops { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.psec > h3 { font: 700 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0; }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow .nm { font-weight: 600; font-size: 17px; }
.prow .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 14px; }
.pq { display: inline-grid; grid-template-columns: 44px 36px 44px; align-items: center; text-align: center; border: 2px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--surface); }
.pq button { height: 44px; border: 0; background: var(--surface2); font: 600 24px var(--body); }
.pq span { font: 600 18px var(--mono); }
.prow .opts { grid-column: 1 / -1; }
.prow .opts .chip { min-height: 38px; font-size: 14px; padding: 0 12px; }
.cart { background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px; font-size: 16px; }
.cart div { display: flex; justify-content: space-between; gap: 12px; }
.webbtn { background: var(--warn-soft); color: var(--warn); border: 0; border-radius: 14px; padding: 8px 16px; font: 700 15px var(--body); }
@media (max-width: 960px) { .tgrid { grid-template-columns: 1fr; } .dishes { position: static; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app" id="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">Lovely<br>Oven<b>orders</b></div>
    <button type="button" id="nav-order" aria-current="page">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
      New order
    </button>
    <button type="button" id="nav-today">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/></svg>
      Meals
      <span class="badge" id="b-today" hidden>0</span>
    </button>
    <button type="button" id="nav-customers">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== CORE: pure logic shared by Code.gs and the form. No Google or DOM calls in here. ===== */

var STATUS_ = { SCHEDULED: 'Scheduled', SERVED: 'Served', CANCELLED: 'Cancelled' };
var KEEP_DAYS_ = 120;

function fail_(msg) { throw new Error(msg); }
function pad2_(n) { return (n < 10 ? '0' : '') + n; }

/* ---- dates are plain 'YYYY-MM-DD' strings so time zones can never shift a meal to another day ---- */
function fromISO_(iso) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function toISO_(d) { return d.getUTCFullYear() + '-' + pad2_(d.getUTCMonth() + 1) + '-' + pad2_(d.getUTCDate()); }
function isISO_(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && toISO_(fromISO_(s)) === s; }
function addDays_(iso, n) { var d = fromISO_(iso); d.setUTCDate(d.getUTCDate() + n); return toISO_(d); }
function dow_(iso) { return fromISO_(iso).getUTCDay(); }
function isWeekend_(iso) { var d = dow_(iso); return d === 0 || d === 6; }
function mondayOf_(iso) { return addDays_(iso, -((dow_(iso) + 6) % 7)); }

/* the next n serving days, starting on `start` when it is a serving day */
function spreadDays_(start, n, weekends) {
  var out = [], d = start, guard = 0;
  while (out.length < n && guard++ < 400) {
    if (weekends || !isWeekend_(d)) out.push(d);
    d = addDays_(d, 1);
  }
  return out;
}

/* ---- names: old rows carry "(cash)" in the name, so strip it for grouping ---- */
function baseName_(raw) {
  return String(raw == null ? '' : raw).replace(/\s*\((?:cash|transfer|bank)\)\s*/ig, ' ').replace(/\s+/g, ' ').trim();
}
function methodFromName_(raw) {
  var m = /\((cash|transfer|bank)\)/i.exec(String(raw || ''));
  return m ? (m[1].toLowerCase() === 'cash' ? 'Cash' : 'Transfer') : '';
}

function money_(v, label) {
  if (v === '' || v == null) return 0;
  var n = Number(v);
  if (!isFinite(n) || n < 0) fail_('Check the ' + label + '.');
  return Math.round(n);
}

/* a basket line is one dish (or drink) with its options; chicken and main meals count as meals, the rest are extras */
function isMain_(it) { return it.g === 'chicken' || it.g === 'setmeal'; }
function cleanItems_(list) {
  var out = [];
  (Array.isArray(list) ? list : []).slice(0, 30).forEach(function (it) {
    var q = Number(it && it.qty), pr = Number(it && it.price);
    if (!it || !isFinite(q) || q < 1 || q > 60 || !isFinite(pr) || pr < 0) return;
    out.push({ g: String(it.g || '').slice(0, 12), value: String(it.value || it.label || '').slice(0, 80), label: String(it.label || it.value || '').slice(0, 80),
      qty: Math.floor(q), price: Math.round(pr), detail: String(it.detail || '').slice(0, 160), opts: it.opts && typeof it.opts === 'object' ? it.opts : {} });
  });
  return out;
}
function itemTotals_(items) {
  var t = { main: 0, other: 0, meals: 0 };
  items.forEach(function (it) { if (isMain_(it)) { t.main += it.price * it.qty; t.meals += it.qty; } else t.other += it.price * it.qty; });
  return t;
}

function payable_(o) { return (o.pfood || 0) + (o.pextra || 0) - (o.disc || 0); }
function cmpMeal_(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.row || 0) - (b.row || 0); }

function indexData_(data) {
  var live = {}, byOid = {}, byRow = {};
  data.meals.forEach(function (m) {
    if (m.status !== STATUS_.CANCELLED && m.oid) (live[m.oid] = live[m.oid] || []).push(m);
  });
  Object.keys(live).forEach(function (k) { live[k].sort(cmpMeal_); });
  data.orders.forEach(function (o) { if (o.oid) byOid[o.oid] = o; byRow[o.row] = o; });
  return { live: live, byOid: byOid, byRow: byRow };
}

/* meals paid for but not yet given a day */
function credit_(ix, o) {
  if (!o || !o.oid) return 0;
  return Math.max(0, o.qty - (ix.live[o.oid] || []).length);
}

/* ---- what the form sees ---- */
function buildState_(data) {
  var today = data.today, ix = indexData_(data);
  var cutoff = addDays_(today, -KEEP_DAYS_), mealCut = addDays_(today, -365), recentCut = addDays_(today, -21), priceCut = addDays_(today, -90);
  var cust = {}, priceCount = {}, orders = [];

  var sorted = data.orders.slice().sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : a.row - b.row;
  });
  sorted.forEach(function (o) {
    var name = baseName_(o.name), key = name.toLowerCase();
    var c = cust[key] || (cust[key] = { name: name, orders: 0, recent: 0, last: '', unitPrice: 0, food: '', method: '', credit: 0, owed: 0, upcoming: 0, served: 0 });
    var pay = payable_(o), owed = Math.max(0, pay - (o.paid || 0)), credit = credit_(ix, o);
    var unit = o.pfood > 0 ? Math.round(o.pfood / o.qty) : 0;
    var method = o.method || methodFromName_(o.name);
    c.name = name; c.orders++; c.last = o.date;
    if (unit) c.unitPrice = unit;
    if (o.food) c.food = o.food;
    if (method) c.method = method;
    c.credit += credit; c.owed += owed;
    if (o.date >= recentCut) c.recent++;
    if (unit && o.date >= priceCut) priceCount[unit] = (priceCount[unit] || 0) + 1;
    if (o.date >= cutoff || owed > 0 || credit > 0) {
      orders.push({ row: o.row, date: o.date, name: name, qty: o.qty, pfood: o.pfood || 0, servedN: ((ix.live[o.oid] || []).filter(function (x) { return x.status === STATUS_.SERVED; })).length, food: o.food || '', extra: o.extra || '', pextra: o.pextra || 0, disc: o.disc || 0, notes: o.notes || '', items: o.items || [], payable: pay, paid: o.paid || 0, owed: owed, oid: o.oid || '', credit: credit, method: method });
    }
  });

  var meals = [];
  data.meals.forEach(function (m) {
    if (m.status === STATUS_.CANCELLED) return;
    var c = cust[baseName_(m.name).toLowerCase()];
    if (c) {
      if (m.status === STATUS_.SERVED) c.served++;
      else if (m.date >= today) c.upcoming++;
    }
    if (m.date >= mealCut || m.status === STATUS_.SCHEDULED) {
      var list = ix.live[m.oid] || [], o = ix.byOid[m.oid];
      meals.push({ id: m.id, date: m.date, name: baseName_(m.name), status: m.status, oid: m.oid || '', n: list.indexOf(m) + 1 || null, of: o ? o.qty : list.length, note: m.note || '' });
    }
  });

  var customers = Object.keys(cust).map(function (k) { return cust[k]; }).sort(function (a, b) {
    return a.last < b.last ? 1 : a.last > b.last ? -1 : a.name < b.name ? -1 : 1;
  });
  var byFreq = Object.keys(priceCount).map(Number).sort(function (a, b) { return priceCount[b] - priceCount[a] || a - b; });
  var prices = byFreq.slice(0, 4).sort(function (a, b) { return a - b; });
  return { today: today, orders: orders.reverse(), meals: meals, customers: customers, prices: prices, topPrice: byFreq[0] || 0, web: data.web || [] };
}

/* validates a list of {date,count}, merges repeats, returns it sorted */
function cleanSchedule_(list, minDate, maxMeals) {
  var by = {}, total = 0;
  (list || []).forEach(function (s) {
    var n = Number(s.count);
    if (!isISO_(s.date)) fail_('One of the meal days is not a valid date.');
    if (!isFinite(n) || Math.floor(n) !== n || n < 1) return;
    if (s.date < minDate) fail_('A meal is dated before the order.');
    by[s.date] = (by[s.date] || 0) + n; total += n;
  });
  if (total > maxMeals) fail_('You have scheduled ' + total + ' meals but only ' + maxMeals + (maxMeals === 1 ? ' is' : ' are') + ' available.');
  return Object.keys(by).sort().map(function (d) { return { date: d, count: by[d] }; });
}

function expandMeals_(sched, name, oid, note, nonce, startIdx) {
  var out = [], i = startIdx || 0;
  sched.forEach(function (s) {
    for (var k = 0; k < s.count; k++) {
      i++;
      out.push({ date: s.date, name: name, status: STATUS_.SCHEDULED, oid: oid, id: 'M' + nonce + '-' + i, note: note || '' });
    }
  });
  return out;
}

/* ---- every change is planned here first, then written to the sheet (or the preview) ---- */
function planSaveOrder_(p, data) {
  var name = baseName_(p.name);
  if (!name) fail_('Enter the customer name.');
  if (name.length > 60) fail_('That name is too long.');
  data.orders.some(function (o) {
    if (baseName_(o.name).toLowerCase() === name.toLowerCase()) { name = baseName_(o.name); return true; }
    return false;
  });
  var items = cleanItems_(p.items), tot = itemTotals_(items);
  var qty = items.length ? Math.max(1, tot.meals) : Number(p.qty);
  if (!isFinite(qty) || Math.floor(qty) !== qty || qty < 1 || qty > 60) fail_('Meals must be a whole number from 1 to 60.');
  if (!isISO_(p.date)) fail_('Pick the order date.');
  var unit = money_(p.unitPrice, 'price per meal'), ep = money_(p.extraPrice, 'extra price');
  var disc = money_(p.discount, 'discount'), paid = money_(p.paid, 'amount paid');
  if (!items.length && unit <= 0) fail_('Enter the price per meal.');
  var pfood = items.length ? tot.main : unit * qty;
  if (items.length) ep += tot.other;
  var pay = pfood + ep - disc;
  if (pay < 0) fail_('The discount is bigger than the order.');
  var trims = [], banked = 0;
  if (p.bank) {
    var ixb = indexData_(data), need = qty, got = 0;
    data.orders.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.row - b.row; }).forEach(function (o) {
      if (need <= 0 || !o.oid || baseName_(o.name).toLowerCase() !== name.toLowerCase()) return;
      var n = Math.min(need, credit_(ixb, o));
      if (n <= 0) return;
      var value = o.qty > 0 ? Math.round((o.pfood || 0) * n / o.qty) : 0, moved = Math.min(o.paid || 0, value);
      need -= n; got += moved; banked += n;
      trims.push({ row: o.row, oid: o.oid, gone: o.qty - n <= 0, qty: o.qty - n, pfood: Math.max(0, (o.pfood || 0) - value), paid: (o.paid || 0) - moved });
    });
    if (!trims.length) fail_('There are no banked meals to use.');
    paid = Math.min(pay, got);
  }
  if (paid > pay) fail_('The amount paid is more than the total.');
  var method = p.method === 'Cash' || p.method === 'Transfer' ? p.method : '';
  var sched = cleanSchedule_(p.schedule, p.date, qty);
  var oid = 'O' + data.nonce, food = String(p.food || '').trim().slice(0, 80), notes = String(p.notes || '').trim().slice(0, 200);
  var meals = expandMeals_(sched, name, oid, food, data.nonce, 0);
  return {
    order: { date: p.date, name: name, qty: qty, food: food, pfood: pfood, extra: String(p.extra || '').trim().slice(0, 80), pextra: ep, disc: disc, paid: paid, notes: notes, items: items, oid: oid, method: method },
    meals: meals, trims: trims,
    info: { banked: banked, oid: oid, name: name, qty: qty, scheduled: meals.length, credit: qty - meals.length, days: sched.map(function (s) { return s.date; }), payable: pay, owed: pay - paid }
  };
}

/* Rewrites an order after the fact, served or not. Meals can't drop below the number already served;
   if the order shrinks, the latest unserved meals are cancelled. If it grows, the extra meals show up as banked. */
function planEditOrder_(p, data) {
  var ix = indexData_(data), o = ix.byRow[p.row];
  if (!o || baseName_(o.name) !== baseName_(p.name) || o.date !== p.date) fail_('That order has changed. Refresh and try again.');
  var items = cleanItems_(p.items), tot = itemTotals_(items), qty, pfood, pextra, food = o.food || '', extra = o.extra || '';
  if (items.length) {
    if (!tot.meals) fail_('Keep at least one meal on the order.');
    qty = tot.meals; pfood = tot.main; pextra = tot.other;
    var txt = function (mains) { return items.filter(function (l) { return l.g !== 'delivery' && isMain_(l) === mains; }).map(function (l) { return (l.qty > 1 ? l.qty + ' × ' : '') + (l.g === 'chicken' ? 'Chicken meal' : l.value); }).join(', ').slice(0, 80); };
    food = txt(true); extra = txt(false);
  } else {
    qty = Number(p.qty);
    if (!isFinite(qty) || Math.floor(qty) !== qty || qty < 1 || qty > 60) fail_('Meals must be a whole number from 1 to 60.');
    pfood = money_(p.unitPrice, 'price per meal') * qty; pextra = money_(p.extraPrice, 'extra price');
  }
  var disc = money_(p.discount, 'discount'), paid = money_(p.paid, 'amount paid'), pay = pfood + pextra - disc;
  if (pay < 0) fail_('The discount is bigger than the order.');
  if (paid > pay) fail_('The amount paid is more than the total.');
  var live = o.oid ? (ix.live[o.oid] || []) : [], served = live.filter(function (x) { return x.status === STATUS_.SERVED; }).length, cancelIds = [];
  if (qty < served) fail_(served + ' meals are already served, so the order cannot go below that.');
  var excess = live.length - qty;
  if (excess > 0) live.filter(function (x) { return x.status === STATUS_.SCHEDULED; }).sort(cmpMeal_).reverse().slice(0, excess).forEach(function (x) { cancelIds.push(x.id); });
  return { row: o.row, fields: { qty: qty, food: food, pfood: pfood, extra: extra, pextra: pextra, disc: disc, paid: paid, notes: String(p.notes || '').trim().slice(0, 200), items: items }, cancelIds: cancelIds,
    info: { name: baseName_(o.name), qty: qty, owed: pay - paid, cancelled: cancelIds.length } };
}

function planSchedule_(p, data) {
  var ix = indexData_(data), o = ix.byOid[p.oid];
  if (!o) fail_('Could not find that order. Refresh and try again.');
  var credit = credit_(ix, o), sched = cleanSchedule_(p.schedule, o.date, credit);
  if (!sched.length) fail_('Pick at least one day.');
  var meals = expandMeals_(sched, baseName_(o.name), o.oid, o.food, data.nonce, (ix.live[o.oid] || []).length + 100);
  return { meals: meals, info: { name: baseName_(o.name), scheduled: meals.length, credit: credit - meals.length } };
}

function findMeal_(data, id) {
  for (var i = 0; i < data.meals.length; i++) if (data.meals[i].id === id) return data.meals[i];
  return fail_('Could not find that meal. Refresh and try again.');
}

function planMealStatus_(p, data) {
  var m = findMeal_(data, p.id), to = p.status, from = m.status;
  var ok = (from === STATUS_.SCHEDULED && (to === STATUS_.SERVED || to === STATUS_.CANCELLED)) || (from === STATUS_.SERVED && to === STATUS_.SCHEDULED);
  if (!ok) fail_('That meal is already ' + from.toLowerCase() + '.');
  return { id: m.id, status: to, info: { name: baseName_(m.name), status: to } };
}

function planMove_(p, data) {
  var m = findMeal_(data, p.id), ix = indexData_(data), o = ix.byOid[m.oid];
  if (m.status !== STATUS_.SCHEDULED) fail_('Only a scheduled meal can be moved.');

  function put(sec, label, n) { T[sec][label] = (T[sec][label] || 0) + n; }
  function putFree(sec, text, n) {
    String(text || '').split(/\s*(?:,|&|\+)\s*/).forEach(function (part) {
      part = part.trim(); if (!part) return;
      var k = sec + '|' + part.toLowerCase().replace(/\s+/g, ' '), label = seen[k] || (seen[k] = part.charAt(0).toUpperCase() + part.slice(1));
      put(sec, label, n);
    });
  }
  function putMain(it, q) {
    var op = it.opts || {};
    if (it.g === 'chicken') {
      put('Meals', 'Chicken Meal', q);
    } else {
      put('Mains', it.value, q);
      if (op.rice === 'Yes') put('Sides and extras', 'Rice', q);
      if (op.side) put('Sides and extras', normSide(op.side), q);
    }
  }
  var live = {};
  S.meals.forEach(function (m) { if (m.oid && m.status !== STATUS_.CANCELLED) (live[m.oid] = live[m.oid] || []).push(m); });
  S.orders.forEach(function (o) {
    var ms = (live[o.oid] || []).slice().sort(cmpMeal_);
    if (!o.oid || !ms.length) return;
    var here = [], first = ms[0].date === date;
    ms.forEach(function (m, idx) { if (m.date === date) here.push(idx); });
    if (!here.length) return;
    if (!o.items || !o.items.length) { putFree('Meals', o.food, here.length); if (first) putFree('Extras', o.extra, 1); return; }
    var units = [];
    o.items.forEach(function (it) { if (isMain_(it)) for (var k = 0; k < it.qty; k++) units.push(it); });
    here.forEach(function (idx) { if (units.length) putMain(units[idx % units.length], 1); });
    if (!first) return;
    o.items.forEach(function (it) {
      var sec = SECOF[it.value];
      if (isMain_(it) || it.g === 'delivery') return;
      if (it.g === 'topping') put('Toppings', it.value, it.qty);
      else if (sec === 'drinks') put('Drinks', it.value, it.qty);
      else put('Sides and extras', normSide(it.value), it.qty);
    });
  });
  return { tally: T, loose: [] };
}

    }))));

}

/* ------------------------------------------------------------------ day tickets (shared by the order and customer screens) */
function makeSchedule(host, cfg) {

    host.textContent = '';

    function bump(date, d) {
      var c = {}, k;

      c[date] = (c[date] || 0) + d;
      if (c[date] <= 0) delete c[date];
      cfg.change(c);
    }
    function tile(date) {
      var n = counts[date] || 0, off = date < min;
      return h('div', { class: 'day' + (n ? ' on' : '') + (off ? ' off' : '') + (date === S.today ? ' today' : '') },
        h('div', { class: 'top' }, h('span', { class: 'dow', text: DOW[dow_(date)] }), h('span', { class: 'num', text: String(+date.slice(8)) }), h('span', { class: 'mon', text: date === S.today ? 'Today' : MON[+date.slice(5, 7) - 1] })),
        h('div', { class: 'ctl' },

    }

    host.appendChild(h('div', { class: 'planhead' }, h('h2', { text: cfg.title }),
      h('span', { class: 'pill ' + (used === total ? 'ok' : used > 0 ? 'warn' : ''), text: used + ' of ' + total + ' scheduled' })));
    host.appendChild(h('p', { class: 'sub', style: 'margin-top:6px', text: cfg.hint() }));

    var start = cfg.spreadFrom();
    host.appendChild(h('div', { class: 'plan-actions' },
      total > 1 ? h('button', { type: 'button', class: 'btn small', text: 'One a day', onclick: function () {
        var c = {}; spreadDays_(start, total, wk).forEach(function (d) { c[d] = (c[d] || 0) + 1; }); cfg.change(c);
      } }) : null,
      total > 1 ? h('button', { type: 'button', class: 'btn small', text: 'All on ' + dayShort(start), onclick: function () { var c = {}; c[start] = total; cfg.change(c); } }) : null,
      h('button', { type: 'button', class: 'btn small', text: 'Clear', disabled: used === 0, onclick: function () { cfg.change({}); } }),

        h('button', { type: 'button', 'aria-label': 'Earlier weeks', text: '‹', disabled: weekOffset === 0, onclick: function () { weekOffset = Math.max(0, weekOffset - 1); render(); } }),

      h('button', { type: 'button', class: 'chip', 'aria-pressed': wk ? 'true' : 'false', text: 'Sat & Sun', onclick: function () { cfg.setWeekends(!cfg.weekends()); } })));

  function check() {
    var t = total(), msg = '';
    if (hasItems && !mains()) msg = 'Keep at least one meal.';
    else if (t < 0) msg = 'The discount is bigger than the order.';
    else if (E.paid > t) msg = 'Paid is more than the total.';
    else if (mains() < o.servedN && hasItems) msg = o.servedN + ' meals are already served.';
    totalEl.textContent = 'Total ' + fmt(Math.max(0, t)) + (E.paid < t ? ' · owes ' + fmt(t - E.paid) : '');
    whyEl.textContent = msg; saveBtn.disabled = !!msg;
  }
  function money(label, get, set) {
    var inp = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': label, value: get() ? fmt(get()) : '' });
    bindMoney(inp, function (n) { set(n); check(); });
    return inp;
  }
  function addLine(it) {
    var l = E.items.filter(function (x) { return x.g === it.g && x.value === it.value; })[0];
    if (l) l.qty = Math.min(60, l.qty + 1);
    else E.items.push({ g: it.g, value: it.value, label: it.label, qty: 1, price: it.price, base: it.price, detail: '', opts: it.rice ? { rice: 'No' } : {} });
    draw();
  }
  function draw() {
    var body = [];
    totalEl = h('strong'); whyEl = h('span', { class: 'sub', style: 'color:var(--warn)' });
    saveBtn = h('button', { type: 'button', class: 'btn primary', text: 'Save changes', onclick: function () {
      closeModal();
      act('editOrder', { row: o.row, name: o.name, date: o.date, items: E.items, qty: E.qty, unitPrice: E.unit, extraPrice: E.extra, discount: E.disc, paid: E.paid, notes: E.notes },
        function (i) { return 'Updated ' + i.name + '’s order' + (i.cancelled ? ' · ' + plural(i.cancelled, 'booked meal') + ' cancelled' : ''); });
    } });
    if (hasItems) {
      E.items.forEach(function (l) {
        var q = h('span', { text: String(l.qty) });
        body.push(h('div', { class: 'prow' },
          h('div', { class: 'nm' }, l.g === 'chicken' ? 'Chicken meal' : l.value, l.detail ? h('small', { text: l.detail }) : null),
          h('div', { class: 'money' }, money('Price each', function () { return l.price; }, function (n) { l.price = n; l.base = n; }), h('span', { text: 'each' })),
          h('div', { class: 'pq' },
            h('button', { type: 'button', 'aria-label': 'One fewer', text: '−', onclick: function () { l.qty--; if (l.qty <= 0) E.items.splice(E.items.indexOf(l), 1); draw(); } }),
            q,
            h('button', { type: 'button', 'aria-label': 'One more', text: '+', disabled: l.qty >= 60, onclick: function () { l.qty++; draw(); } }))));
      });
      if (MENU) body.push(dropdown('Add an item', MENU.sections.map(function (x) { return { title: x.title, items: x.items }; }), function (v) { if (BYVAL[v]) addLine(BYVAL[v]); }));
    } else {
      body.push(h('div', { class: 'row' }, h('span', { class: 'sub', text: 'Meals' }),
        h('div', { class: 'pq' },
          h('button', { type: 'button', text: '−', disabled: E.qty <= 1, onclick: function () { E.qty--; draw(); } }), h('span', { text: String(E.qty) }),
          h('button', { type: 'button', text: '+', disabled: E.qty >= 60, onclick: function () { E.qty++; draw(); } })),
        h('span', { class: 'sub', text: 'at' }), h('div', { class: 'money' }, money('Price per meal', function () { return E.unit; }, function (n) { E.unit = n; }), h('span', { text: 'each' }))));
      body.push(h('div', { class: 'row' }, h('span', { class: 'sub', text: 'Extras' }), h('div', { class: 'money' }, money('Extras', function () { return E.extra; }, function (n) { E.extra = n; }), h('span', { text: 'VND' }))));
    }
    body.push(h('div', { class: 'row' }, h('span', { class: 'sub', text: 'Discount' }), h('div', { class: 'money' }, money('Discount', function () { return E.disc; }, function (n) { E.disc = n; }), h('span', { text: 'VND' }))));
    paidInp = money('Paid', function () { return E.paid; }, function (n) { E.paid = n; });
    body.push(h('div', { class: 'row' }, h('span', { class: 'sub', text: 'Paid' }), h('div', { class: 'money' }, paidInp, h('span', { text: 'VND' })),
      h('button', { type: 'button', class: 'btn small', text: 'Paid in full', onclick: function () { E.paid = Math.max(0, total()); paidInp.value = E.paid ? fmt(E.paid) : ''; check(); } })));
    var notes = h('input', { type: 'text', autocomplete: 'off', placeholder: 'Notes', 'aria-label': 'Notes', value: E.notes });
    notes.addEventListener('input', function () { E.notes = notes.value; });
    body.push(notes);
    openModal([h('h2', { text: 'Edit ' + o.name + '’s order' }), h('p', { class: 'sub', text: dayLong(o.date) + (o.servedN ? ' · ' + plural(o.servedN, 'meal') + ' already served' : '') }),
      body, h('div', { class: 'row' }, totalEl, h('div', { class: 'grow' }), whyEl),
      h('div', { class: 'row' }, saveBtn, h('button', { type: 'button', class: 'btn', text: 'Cancel', onclick: closeModal }))]);
    check();
  }
  draw();
}

function confirmDelete(o) {
  openModal([
    h('h2', { text: 'Delete this order?' }),
    h('p', { class: 'sub', text: o.name + ' · ' + dayLong(o.date) + ' · ' + plural(o.qty, 'meal') + ' · ' + fmt(o.payable) + (o.paid ? ' (marked paid ' + fmt(o.paid) + ')' : '') }),
    h('p', { class: 'sub', text: 'It is removed completely, along with any meals booked for it. This cannot be undone.' }),
    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn danger', text: 'Yes, delete it', onclick: function () { closeModal(); act('deleteOrder', { row: o.row, name: o.name, date: o.date }, function (i) { return 'Deleted ' + i.name + '’s order'; }); } }),
      h('button', { type: 'button', class: 'btn', text: 'Keep it', onclick: closeModal }))
  ]);
}

function confirmRefund(o) {
  var n = o.qty - o.servedN, back = o.qty ? Math.min(o.paid, Math.round(o.pfood * n / o.qty)) : 0;
  openModal([
    h('h2', { text: 'Refund this order?' }),
    h('p', { class: 'sub', text: o.name + ' · ' + dayLong(o.date) + ' · ' + plural(n, 'meal') + ' not yet served' }),
    h('p', { class: 'sub', text: 'Those meals are taken off the order, whether booked or not, and ' + (back ? fmt(back) + ' goes back to the customer.' : 'there is nothing to pay back.') + (o.servedN ? ' The ' + plural(o.servedN, 'served meal') + ' stay.' : ' The whole order is removed.') }),
    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn danger', text: back ? 'Refund ' + fmt(back) : 'Remove meals', onclick: function () { closeModal(); act('trimOrder', { kind: 'refund', row: o.row, name: o.name, date: o.date }, function (i) { return (i.refunded ? 'Refunded ' + fmt(i.refunded) + ' to ' : 'Removed the unserved meals for ') + i.name + (i.gone ? ' · order removed' : ''); }); } }),
      h('button', { type: 'button', class: 'btn', text: 'Keep it', onclick: closeModal }))
  ]);
}

function confirmDeleteServed(o) {
  openModal([
    h('h2', { text: 'Delete served meals?' }),
    h('p', { class: 'sub', text: o.name + ' · ' + dayLong(o.date) + ' · ' + plural(o.servedN, 'served meal') }),
    h('p', { class: 'sub', text: 'They are erased from the record and the order total drops by the same amount. What the customer owes does not change. This cannot be undone.' }),
    h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn danger', text: 'Yes, delete them', onclick: function () { closeModal(); act('trimOrder', { kind: 'served', row: o.row, name: o.name, date: o.date }, function (i) { return 'Deleted ' + plural(i.n, 'served meal') + (i.gone ? ' and the order' : '') + ' for ' + i.name; }); } }),
      h('button', { type: 'button', class: 'btn', text: 'Keep them', onclick: closeModal }))
  ]);
}

/* ticks a list of meals off one after another, then shows one message */
function markServed(list) {
  if (busy || !list.length) return;
  (function next(i) {
    if (i >= list.length) return;
    act('setMealStatus', { id: list[i].id, status: STATUS_.SERVED }, i === list.length - 1 ? plural(list.length, 'meal') + ' marked as served' : null)
      .then(function (r) { if (r && r.state) next(i + 1); });
  })(0);
}

function renderDetail() {
  var host = $('c-detail'); host.textContent = '';
  var c = CV.sel ? findCustomer(CV.sel) : null;
  if (!c) { host.appendChild(h('div', { class: 'empty' }, h('strong', { text: 'No customer selected' }), h('p', { text: 'Pick a customer on the left to see their meals and what they owe.' }))); return; }
  var key = c.name.toLowerCase();
  var mine = S.orders.filter(function (o) { return o.name.toLowerCase() === key; });
  var toSched = mine.filter(function (o) { return o.oid && o.credit > 0; });
  var unpaid = mine.filter(function (o) { return o.owed > 0; });
  var upcoming = S.meals.filter(function (m) { return m.name.toLowerCase() === key && m.status === STATUS_.SCHEDULED && m.date >= S.today; }).sort(cmpMeal_);
  var dueNow = upcoming.filter(function (m) { return m.date <= S.today; });
  var detail = h('div', { class: 'stack' });

  detail.appendChild(h('div', null, h('h1', { text: c.name }),
    h('p', { class: 'sub', style: 'margin-top:6px', text: 'Last order ' + dayLong(c.last) + (c.unitPrice ? ' · usually ' + fmt(c.unitPrice) + ' a meal' : '') })));
  detail.appendChild(h('div', { class: 'tiles' },
    h('div', { class: 'tile' + (c.credit ? ' warn' : '') }, h('b', { text: String(c.credit) }), h('span', { text: 'To schedule' })),
    h('div', { class: 'tile' }, h('b', { text: String(c.upcoming) }), h('span', { text: 'Booked' })),
    h('div', { class: 'tile' }, h('b', { text: String(c.served) }), h('span', { text: 'Served' })),
    h('div', { class: 'tile' + (c.owed ? ' bad' : '') }, h('b', { text: fmt(c.owed) }), h('span', { text: 'Owes' }))));

  toSched.forEach(function (o) {
    var st = CV.sched[o.oid] || (CV.sched[o.oid] = { counts: {}, weekends: false });
    var min = o.date > S.today ? o.date : S.today, hostEl = h('div'), saveBtn;
    var widget = makeSchedule(hostEl, {
      title: 'Schedule ' + plural(o.credit, 'meal'),
      total: function () { return o.credit; },
      min: function () { return min; },
      counts: function () { return st.counts; },
      change: function (cc) { st.counts = cc; widget.render(); sync(); },
      weekends: function () { return st.weekends; },
      setWeekends: function (b) { st.weekends = b; widget.render(); },
      hint: function () { return 'From the order of ' + dayLong(o.date) + ' (' + plural(o.qty, 'meal') + '). Pick the days they will eat.'; },
      spreadFrom: function () { return min; }
    });
    function sync() { saveBtn.disabled = sum(st.counts) === 0; saveBtn.textContent = sum(st.counts) ? 'Save ' + plural(sum(st.counts), 'meal') : 'Pick a day'; }
    saveBtn = h('button', { type: 'button', class: 'btn primary', text: 'Pick a day', disabled: true, onclick: function () {
      var sched = Object.keys(st.counts).map(function (d) { return { date: d, count: st.counts[d] }; });
      act('scheduleMeals', { oid: o.oid, schedule: sched }, function (i) { delete CV.sched[o.oid]; return 'Scheduled ' + plural(i.scheduled, 'meal') + ' for ' + i.name; });
    } });
    detail.appendChild(h('div', { class: 'box' }, hostEl, h('div', { class: 'row' }, h('div', { class: 'grow' }), saveBtn)));
    widget.render(); sync();
  });

  if (upcoming.length) {
    detail.appendChild(h('div', { class: 'sect' }, h('h2', { text: 'Booked meals' }), dueNow.length ? h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn ok', text: 'Mark ' + plural(dueNow.length, 'meal') + ' due today as served', onclick: function () { markServed(dueNow); } })) : null, h('div', { class: 'mgrid' }, upcoming.map(function (m) { return mealCard(m, true); }))));
  }

  if (unpaid.length) {
    detail.appendChild(h('div', { class: 'sect' }, h('h2', { text: 'Money owed' }), unpaid.map(function (o) {
      var amt = o.owed, inp = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', 'aria-label': 'Amount received', value: fmt(o.owed) });
      bindMoney(inp, function (n) { amt = n; });
      return h('div', { class: 'box' },
        h('div', { class: 'row' }, h('div', { class: 'grow' }, h('strong', { text: dayLong(o.date) + ' · ' + plural(o.qty, 'meal') }),
          h('div', { class: 'sub', text: 'Total ' + fmt(o.payable) + ' · paid ' + fmt(o.paid) + ' · owes ' + fmt(o.owed) })),
          h('div', { class: 'money' }, inp, h('span', { text: 'VND' })),
          h('button', { type: 'button', class: 'btn ok', text: 'Record payment', onclick: function () {
            act('recordPayment', { row: o.row, name: o.name, date: o.date, amount: amt }, function (i) { return 'Recorded ' + fmt(i.amount) + ' from ' + i.name + (i.owed ? ' · still owes ' + fmt(i.owed) : ' · all paid'); });
          } })));
    })));
  }

  detail.appendChild(h('div', { class: 'sect' }, h('h2', { text: 'Recent orders' }),
    h('div', { class: 'rl', style: 'max-height:460px;overflow:auto;align-content:start' }, mine.map(function (o) {
      return [h('span', { text: dayLong(o.date) }), h('span', { text: plural(o.qty, 'meal') + (o.notes ? ' · ' + o.notes : '') }), h('span', { class: 'r', text: fmt(o.payable) }),
        h('span', { class: 'r', style: 'display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center' }, (o.owed ? 'owes ' + fmt(o.owed) : 'paid') + ' ',
          h('button', { type: 'button', class: 'btn small', text: 'Edit', 'aria-label': 'Edit this order', onclick: function () { openEdit(o); } }),
          o.qty - o.servedN > 0 ? h('button', { type: 'button', class: 'btn small', text: 'Refund', 'aria-label': 'Refund the meals not yet served', onclick: function () { confirmRefund(o); } }) : null,
          o.servedN > 0 ? h('button', { type: 'button', class: 'btn small', text: 'Delete served', 'aria-label': 'Delete the served meals', onclick: function () { confirmDeleteServed(o); } }) : null,
          h('button', { type: 'button', class: 'btn small danger', text: 'Delete order', 'aria-label': 'Delete this order', onclick: function () { confirmDelete(o); } }))];
    }))));
  host.appendChild(detail);
}

/* ------------------------------------------------------------------ shell */
function go(v) {
  view = v;
  ['order', 'today', 'customers'].forEach(function (x) {
    $('view-' + x).hidden = x !== v;
    $('nav-' + x).setAttribute('aria-current', x === v ? 'page' : 'false');
  });
  if (S) renderAll();
}
function renderNav() {
  var t = S.meals.filter(function (m) { return m.status === STATUS_.SCHEDULED && m.date <= S.today; }).length;
  var c = S.customers.filter(needsAttention).length;
  $('b-today').textContent = t; $('b-today').hidden = !t;
  $('b-cust').textContent = c; $('b-cust').hidden = !c;
}
function renderAll() {
  renderNav();
  if (view === 'order') updateOrder();
  else if (view === 'today') renderToday();
  else renderCustomers();
}

function init() {
  if (!useSb) $('previewbar').hidden = false;
  wireOrder();
  $('boot-key').onsubmit = function (ev) {
    ev.preventDefault();
    var email = $('email-in').value.trim(), pw = $('key-in').value;
    $('boot-key').hidden = true; $('boot-msg').textContent = 'Signing in…';
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) {
      if (r.error) askLogin('Wrong email or password.'); else { $('boot-msg').textContent = 'Loading orders…'; load(false); }
    }).catch(function () { askLogin('Could not reach the server.'); });
  };
  $('nav-order').onclick = function () { go('order'); };
  $('nav-today').onclick = function () { go('today'); };
  $('nav-customers').onclick = function () { go('customers'); };
  $('nav-refresh').onclick = function () { if (!busy) load(false); };
  if (useSb) {
    sb.auth.getSession().then(function (r) {
      if (r.data.session) { $('who').textContent = r.data.session.user.email; $('nav-out').hidden = false; $('nav-out').title = 'Signed in as ' + r.data.session.user.email + '. Tap to sign out.'; }
    });
    sb.auth.onAuthStateChange(function (ev, session) {
      $('nav-out').hidden = !session;
      if (session) $('who').textContent = session.user.email;
    });
    $('nav-out').onclick = function () { sb.auth.signOut().then(function () { S = null; D = null; askLogin('Signed out'); }); };
  }
  $('boot-retry').onclick = function () { $('boot-retry').hidden = true; $('boot-msg').textContent = 'Loading orders…'; load(false); };
  $('t-prev').onclick = function () { TV.date = addDays_(TV.date || S.today, -1); renderToday(); };
  $('t-next').onclick = function () { TV.date = addDays_(TV.date || S.today, 1); renderToday(); };
  $('t-date').onchange = function () { if (this.value) { TV.date = this.value; renderToday(); } };
  $('c-search').addEventListener('input', function () { CV.q = $('c-search').value; renderCustomers(); });
  $('modal').addEventListener('click', function (ev) { if (ev.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S && !busy && view !== 'customers' && Date.now() - lastLoad > 60000) load(true);
  });
  load(true);
}
init();
})();
</script>

</html>
